
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Universe ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(ellipse at 20% 20%, #51316f, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #572b68, transparent 45%),
        linear-gradient(135deg, #090817, #17102d, #100b20);
    color: white;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px #e5c5ff;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%, 100% { opacity: .2; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.7); }
}

.container {
    position: relative;
    z-index: 2;
    width: min(90%, 460px);
    padding: 50px 30px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 30px;
    background: rgba(255,255,255,.055);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 70px rgba(174,100,255,.13);
    animation: appear 1.5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.heart {
    color: #f2b8e8;
    font-size: 35px;
    margin-bottom: 15px;
    text-shadow: 0 0 20px #eaa4ff;
}

.logo {
    font-family: 'Great Vibes', cursive;
    font-size: 48px;
    color: #f5d6ff;
    margin-bottom: 8px;
}

.subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: #c7afd9;
    margin-bottom: 45px;
}

.question {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(30px, 8vw, 42px);
    color: #fff0ff;
    margin-bottom: 30px;
    line-height: 1.3;
}

.input-box {
    width: 100%;
    padding: 17px;
    border: 1px solid rgba(225,190,255,.4);
    border-radius: 15px;
    outline: none;
    background: rgba(255,255,255,.07);
    color: white;
    text-align: center;
    font-family: 'Great Vibes', cursive;
    font-size: 30px;
    transition: .3s;
}

.input-box:focus {
    border-color: #e8b5ff;
    box-shadow: 0 0 20px rgba(218,155,255,.2);
}

.input-box::placeholder {
    color: #c7afd9;
}

.continue {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 15px;
    background: linear-gradient(110deg, #c38bd9, #e6acd9);
    color: #24112e;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    cursor: pointer;
    transition: .3s;
}

.continue:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 25px rgba(222,155,255,.3);
}

.footer {
    margin-top: 35px;
    color: #bba3d0;
    font-family: 'Great Vibes', cursive;
    font-size: 22px;
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="container">

    <div class="heart">♡</div>

    <div class="logo">My Universe</div>

    <div class="subtitle">a little world made for you</div>

    <div class="question">
        Мені қалай атағың келеді?
    </div>

    <input
        class="input-box"
        id="nickname"
        type="text"
        value="Еркош"
        placeholder="Еркелетіп ата..."
        autocomplete="off"
    >

    <button class="continue" onclick="continuePage()">
        Жалғастыру ♡
    </button>

    <div class="footer">made with love</div>

</div>

<script>
const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {
    const star = document.createElement("span");
    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.animationDuration = (2 + Math.random() * 3) + "s";

    const size = 1 + Math.random() * 2;
    star.style.width = size + "px";
    star.style.height = size + "px";

    stars.appendChild(star);
}

function continuePage() {
    const nickname = document.getElementById("nickname").value.trim();

    if (!nickname) {
        document.getElementById("nickname").focus();
        return;
    }

    alert("Қош келдің, " + nickname + " ♡");
}
</script>

</body>
</html>
